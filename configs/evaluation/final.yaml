name: "Final Debugged Motion Evaluation"
version: "1.0"

metadata:
  description: "Curated collection of fully debugged and validated motion quality metrics"
  use_case: "Production-ready evaluation with verified metric implementations"
  author: "Motion Toolbox"
  status: "Under Development - Adding metrics as they complete debugging"

global_params:
  velocity_threshold: 0.02
  ground_height: 0.0

# Ratio assessment thresholds for report generation
# These thresholds determine how ratio values are assessed (Good, Moderate, High concern)
# Ratios represent the percentage of frames with detected issues
ratio_thresholds:
  foot_skating_joint:
    good: 0.40      # < 40% is good
    moderate: 0.60  # 40-60% is moderate, > 60% is high concern
  foot_skating_mesh:
    good: 0.60      # < 60% is good
    moderate: 0.80  # 60-80% is moderate, > 80% is high concern
  jerk:
    good: 0.40      # < 40% is good
    moderate: 0.60  # 40-60% is moderate, > 60% is high concern
  penetration:
    excellent: 0.15  # < 15% is excellent
    moderate: 0.30   # 15-30% is moderate, > 30% is high concern
  floating:
    excellent: 0.05  # < 5% is excellent
    moderate: 0.15   # 5-15% is moderate, > 15% is high concern
  dynamic:
    static: 0.10        # < 10% is static
    low_activity: 0.50  # 10-50% is low activity, > 50% is active (good)
  root_rotation:
    good: 0.10      # < 10% is good (stable motion)
    moderate: 0.30  # 10-30% is moderate, > 30% is high concern (jittery/unstable)

