metrics:
  # ===============================================================================
  # VALIDATED METRICS - Ready for Production Use
  # ===============================================================================
  
  # Foot Skating Detection (HOIDINI variants - fully debugged)
  - name: "foot_skating_hoidini_joint"
    metric: "foot_skating"
    convention: "hoidini_foot_skating"
    description: "HOIDINI joint-based foot skating detection (VERIFIED)"
    params:
      contact_threshold: 0.01  # 10mm contact threshold for fair comparison
      skating_threshold: 0.005  # 5mm/frame displacement threshold
    status: "✅ VERIFIED - Correct vertex indices, proper coordinate system, validated thresholds"
      
  - name: "foot_skating_hoidini_mesh"
    metric: "foot_skating"
    convention: "hoidini_mesh_skating"
    description: "HOIDINI mesh-based foot skating detection (VERIFIED)"
    params:
      contact_threshold: 0.01  # 10mm contact threshold for fair comparison
      skating_threshold: 0.005  # 5mm/frame displacement threshold
      body_model: "smpl"  # Uses validated SMPL foot vertex topology
    status: "✅ VERIFIED - Config-based vertex loading, bounds validation, unified vertex set"

  # Ground Penetration Detection (HOIDINI variants - fully debugged)
  - name: "ground_penetration_hoidini_joint"
    metric: "ground_penetration"
    convention: "hoidini_floor_metrics"
    description: "HOIDINI joint-based ground penetration detection (VERIFIED)"
    params:
      floor_height: 0.0  # Ground level (HOIDINI standard)
      contact_threshold: 0.05  # 50mm contact threshold (same as foot contact)
      penetration_threshold: -0.01  # -10mm penetration threshold (negative = below ground)
    status: "✅ VERIFIED - Enhanced visualization, frame-by-frame metadata, proper threshold detection"
      
  - name: "ground_penetration_hoidini_mesh"
    metric: "ground_penetration"
    convention: "hoidini_mesh_penetration"
    description: "HOIDINI mesh-based ground penetration detection (VERIFIED)"
    params:
      floor_height: 0.0  # Ground level (HOIDINI standard)
      body_model: "smpl"  # Uses validated SMPL foot vertex topology
      contact_threshold: 0.05  # 50mm contact threshold (same as foot contact)
      penetration_threshold: -0.01  # -10mm penetration threshold (negative = below ground)
    status: "✅ VERIFIED - Uses verified foot vertices, enhanced visualization, frame-by-frame data"

  # Floating Detection (CLoSD variant - verified)
  - name: "floating_closd"
    metric: "floating"
    convention: "closd_floating"
    description: "CLoSD floating detection - feet hovering above ground (VERIFIED)"
    params:
      tolerance: 0.005  # 5mm tolerance (CLoSD original) - for floating calculation
      contact_threshold: 0.05  # 50mm contact threshold (same as other metrics)
      floating_threshold: 0.05  # 50mm floating threshold (same as contact - floating is non-contact)
    status: "✅ VERIFIED - Enhanced visualization, frame-by-frame metadata, consistent thresholds"

  # Jerk Analysis (Motion Smoothness)
  - name: "jerk_mean"
    metric: "jerk"
    convention: "mean_jerk"
    description: "Mean jerk calculation (StableMotion/GVHMR standard) (VERIFIED)"
    params:
      jerk_threshold: 10.0  # Threshold for high jerk detection (after /10.0 scaling)
    status: "✅ VERIFIED - Standard mean jerk formulation with /10.0 scaling, enhanced visualization with threshold detection"
      
  - name: "jerk_gradient"
    metric: "jerk"
    convention: "gradient_jitter"
    description: "Gradient-based jerk calculation (more robust to noise) (VERIFIED)"
    params:
      jerk_threshold: 10.0  # Same threshold as mean jerk for consistency
    status: "✅ VERIFIED - Same formulation as mean jerk, using np.gradient for smoother derivatives, enhanced visualization"

  # Dynamic Motion Score
  - name: "dynamic_score"
    metric: "dynamic_score"
    convention: "hybrid_velocity_acceleration"
    description: "Dynamic motion score - measures motion activity and naturalness (VERIFIED)"
    params:
      velocity_threshold: 0.02  # 20mm/s minimum velocity for active motion
      acceleration_threshold: 0.5  # 0.5 m/s² minimum acceleration
    status: "✅ VERIFIED - Hybrid velocity-acceleration analysis, frame-by-frame motion activity detection"

  # Root orientation change metrics
  - name: "root_orientation_change"
    metric: "root_orientation_change"
    convention: "max_root_rotation"
    description: "Root orientation stability - detects sudden rotation changes (jitter/tracking errors) (VERIFIED)"
    params:
      rotation_threshold_degrees: 45.0  # Threshold for ratio calculation (frames with >45° rotation)
    status: "✅ VERIFIED - Measures frame-to-frame root rotation changes, identifies tracking instability"
