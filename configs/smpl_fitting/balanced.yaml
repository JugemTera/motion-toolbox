# Balanced SMPL Fitting Configuration (High Quality)
# Uses LBFGS 150 with two-stage optimization for HumanML3D-SMPL standard quality

optimizer:
  type: "lbfgs"
  num_iterations: 150  # Standard from HumanML3D-SMPL
  
strategy:
  single_stage: false  # Two-stage optimization for convergence
  use_batching: true
  batch_size: 32
  beta_optimization: true  # Allow body shape optimization
  
loss_weights:
  joint_loss: 600.0  # Standard from MDM/HumanML3D
  pose_prior: 1.0
  angle_prior: 15.02
  shape_prior: 5e-3
  
device: "cuda:0"

description: "High quality configuration using two-stage LBFGS 150 iterations with beta optimization"
expected_performance:
  speedup: "~2x"
  error: "0.43cm"
  quality: "Excellent (HumanML3D standard)"
  use_case: "When highest quality is needed, matches HumanML3D-SMPL quality"
